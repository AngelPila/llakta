services:
  app:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      HOME: /tmp
      # Proveedor de IA: gemini | groq | deepseek | ollama | anthropic | demo (vacío = autodetectar por la clave que exista)
      LLAKTA_PROVIDER: ${LLAKTA_PROVIDER:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_FAST_MODEL: ${LLM_FAST_MODEL:-}
    env_file:
      - path: .env
        required: false
    ports:
      - "${PORT:-3210}:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
